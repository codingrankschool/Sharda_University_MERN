//To get proper msg from promise it is required to consume the promise.

//1. .then().catch()
//2. async and await


//Good Example:

let loadingHeading = document.getElementById('loader')
let studentContainer = document.getElementById('student-container')

function fetchStudentData(){
    loading(true)
    return new Promise(function(resolve, reject){
        setTimeout(function(){
            loading(false)
            let data = [{name:"Rakesh"}, {name:"Rajni"}, {name:"Rohit"}]

            reject(data)

        }, 5000)
    })
}

//async & await


async function getData(){
    try {
        let data = await fetchStudentData()
       displayStudent(data)
    } catch (error) {
        console.log("Rejected")
    }
}

getData()


function loading(status){
    loadingHeading.innerText = status?"Loading":"Loaded Data"
}


function displayStudent(students){
    students.forEach(function(student, index){
        let para = document.createElement('p')
        para.innerText = student.name

        studentContainer.append(para)
    })
}
