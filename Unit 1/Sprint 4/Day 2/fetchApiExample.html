//API - http://api.openweathermap.org/geo/1.0/direct?q={city name}&limit={limit}&appid={API key}


//http://api.openweathermap.org/geo/1.0/direct?q=Noida&limit=10&appid=d1db5f884282b1f826a4760ea6be28e6


async function fetchWeather(city){
    let response = await fetch(`http://api.openweathermap.org/geo/1.0/direct?q=${city}&limit=10&appid=d1db5f884282b1f826a4760ea6be28e6`)

    let data = await response.json();
    console.log(data)
}
