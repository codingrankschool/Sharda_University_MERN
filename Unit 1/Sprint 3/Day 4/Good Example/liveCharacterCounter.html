<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Character Counter</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f4f4f4;
    font-family:Arial, sans-serif;
}

.container{
    width:400px;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h2{
    margin-bottom:15px;
}

textarea{
    width:100%;
    height:150px;
    padding:10px;
    resize:none;
    font-size:16px;
}

p{
    margin-top:10px;
    font-size:18px;
}

span{
    color:#2196f3;
    font-weight:bold;
}

</style>

</head>
<body>

<div class="container">

    <h2>Enter Your Message</h2>

    <textarea id="message"></textarea>

    <p>
        Characters :
        <span id="count">0</span>
    </p>

</div>

</body>
</html>


    <script>

        var textAreaBox = document.getElementById('message')
        var countDisplay = document.getElementById('count')

        textAreaBox.addEventListener('input', function(){

            var value = textAreaBox.value
            //console.log(value.length)

            countDisplay.innerText = value.length

        })

    </script>
