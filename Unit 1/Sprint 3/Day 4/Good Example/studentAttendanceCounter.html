<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Attendance Counter</title>

<style>

    *{
        margin:0;
        padding:0;
        box-sizing:border-box;
    }

    body{
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#f5f5f5;
        font-family:Arial, sans-serif;
    }

    .container{
        text-align:center;
        background:white;
        padding:30px;
        border-radius:10px;
        box-shadow:0 0 10px rgba(0,0,0,0.2);
    }

    h1{
        font-size:60px;
        color:#2196f3;
        margin-bottom:20px;
    }

    button{
        padding:12px 20px;
        border:none;
        background:#2196f3;
        color:white;
        border-radius:5px;
        cursor:pointer;
        font-size:16px;
    }

    button:hover{
        background:#1976d2;
    }

</style>

</head>
<body>

<div class="container">

    <h2>Student Attendance Counter</h2>

    <h1 id="count">0</h1>

    <button id="presentBtn">
        Present Student
    </button>

</div>

</body>
</html>

<script>

    var clickBtn = document.getElementById('presentBtn')
    var countDisplay = document.getElementById('count')

    var count = 0
    clickBtn.addEventListener('click', function(){
        //count++
        countDisplay.innerText = ++count
    })


</script>
